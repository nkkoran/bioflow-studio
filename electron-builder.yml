appId: com.koran.bioflowstudio
productName: BioFlow Studio
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - "!src/**"
  - "!electron/**"
  - "!**/.vscode/**"
asar: true
asarUnpack:
  - "**/node_modules/ssh2/**"
  - "**/node_modules/cpu-features/**"
extraResources:
  - from: resources/python-bridge
    to: python-bridge
  - from: resources/dx-applets
    to: dx-applets
  - from: docs/gwas-quickstart.md
    to: docs/gwas-quickstart.md
  - from: docs/bcftools-workflow.md
    to: docs/bcftools-workflow.md
  - from: docs/ukb-extract-quickstart.md
    to: docs/ukb-extract-quickstart.md
mac:
  identity: null
  singleArchFiles: "{**/node_modules/cpu-features/**/*.node,**/node_modules/ssh2/**/*.node}"
  x64ArchFiles: "{**/node_modules/cpu-features/**/*.node,**/node_modules/ssh2/**/*.node}"
  target:
    - target: dmg
      arch: [universal]
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  category: Science
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: nkkoran
  repo: bioflow-studio
  private: false
  releaseType: draft
