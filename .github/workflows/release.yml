name: Release

# Runs when you push a tag like v0.1.0-beta.2 or click "Run workflow" in the
# Actions tab. Builds Mac (universal) and Windows (x64), uploads artefacts to a
# DRAFT GitHub Release. You review the draft and click Publish when ready.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-beta.2). Must already exist.'
        required: true

# Cancel an in-flight build if a newer tag arrives for the same workflow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # required so electron-builder can create/update releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14    # Apple Silicon runner; builds universal DMG
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (electron-vite)
        run: npm run build

      - name: Package + publish (${{ matrix.target }})
        env:
          # GitHub-provided token, scoped to this repo. electron-builder reads it as GH_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code-signing in CI (no Developer ID identity available).
          # The DMG ships unsigned; lab members work around Gatekeeper with the
          # documented xattr/right-click steps.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }} --publish always
